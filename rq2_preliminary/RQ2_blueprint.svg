<text x="45" y="553" font-size="11.5" fill="#8a93a0">QC stimuli → 抽取 E1 → NLA E2 ┐    生成 E4/E6 ┘ → 分析(E1–E3 / E5 think-say / E6) → 寫作整合 → 投稿</text>
